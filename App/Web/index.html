<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'">
<title>Blackboard</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="css/board.css">
</head>
<body>
<div id="frame">
  <div id="slate">
    <div id="topbar">
      <button id="btn-new" class="top-btn" title="New board (⌘N)">＋</button>
      <nav id="crumbs" aria-label="Where you are"></nav>
      <span class="spacer"></span>
      <button id="btn-back" class="top-btn wide" title="Close every side question and go back to the original (⇧⌘⌫)">⟲ back to the original</button>
      <button id="btn-map" class="top-btn" title="Board map: every side question (⇧⌘M)">⌘ map</button>
      <button id="btn-font" class="top-btn" title="Chalk font">Aa</button>
      <button id="btn-zoom-out" class="top-btn" title="Zoom out (⌘−)">−</button>
      <button id="btn-zoom-in" class="top-btn" title="Zoom in (⌘=)">+</button>
      <button id="status" class="top-btn status" title="Model"><span class="dot"></span><span id="status-text">connecting…</span></button>
    </div>
    <main id="board">
      <div id="stage">
        <div id="columns"></div>
        <svg id="overlay" aria-hidden="true"></svg>
      </div>
    </main>
  </div>
  <div id="ledge" aria-hidden="true">
    <span class="chalk-stick s1"></span><span class="chalk-stick s2"></span><span class="chalk-stick s3"></span>
    <button id="ledge-eraser" title="Erase back to the original (close all side questions)"><span class="felt"></span></button>
  </div>
</div>

<aside id="outline" hidden>
  <div class="outline-head"><span class="chalk-title">board map</span><button id="outline-close" class="icon-btn">✕</button></div>
  <div id="outline-tree"></div>
</aside>

<div id="popover" hidden>
  <div id="pop-quote"></div>
  <div id="pop-chips"></div>
  <div class="pop-row">
    <input id="pop-input" placeholder="…or ask your own side question" autocomplete="off" spellcheck="false">
    <button id="pop-ask" class="chalk-btn primary">ask ↳</button>
  </div>
</div>

<div id="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/contrib/mhchem.min.js"></script>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="js/util.js"></script>
<script src="js/render.js"></script>
<script src="js/bridge.js"></script>
<script src="js/model.js"></script>
<script src="js/anchors.js"></script>
<script src="js/app.js"></script>
<script src="js/selftest.js"></script>
</body>
</html>
