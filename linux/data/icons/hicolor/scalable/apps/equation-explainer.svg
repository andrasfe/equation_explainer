<?xml version="1.0" encoding="UTF-8"?>
<!-- Equation Explainer: a little chalkboard. Same design as macos/scripts/make_icon.swift. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9e6b40"/><stop offset="1" stop-color="#54361c"/>
    </linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334539"/><stop offset="1" stop-color="#1a241f"/>
    </linearGradient>
    <radialGradient id="smudge" cx="0.37" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.11"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="180" fill="url(#wood)"/>
  <rect x="128" y="128" width="768" height="768" rx="120" fill="url(#slate)"/>
  <rect x="128" y="128" width="768" height="768" rx="120" fill="url(#smudge)"/>
  <text x="200" y="560" font-family="Chalkduster, 'Fredericka the Great', 'Patrick Hand', 'Comic Sans MS', cursive" font-size="300" fill="#f2f0e6" opacity="0.95">∂ψ</text>
  <text x="520" y="790" font-family="Chalkduster, 'Fredericka the Great', 'Patrick Hand', 'Comic Sans MS', cursive" font-size="130" fill="#f6e08a" opacity="0.95">|0⟩</text>
  <ellipse cx="655" cy="745" rx="170" ry="98" fill="none" stroke="#f3a5b5" stroke-width="14" stroke-opacity="0.9" stroke-linecap="round" stroke-dasharray="560 40" transform="rotate(-4 655 745)"/>
</svg>
